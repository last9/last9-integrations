version: '3.6'
services:
  telegraf:
    image: telegraf:1.24
    volumes:
    - ./telegraf/etc/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - LAST9_REMOTE_WRITE_URL=${LAST9_REMOTE_WRITE_URL}
      - LAST9_REMOTE_WRITE_USERNAME=${LAST9_REMOTE_WRITE_USERNAME}
      - LAST9_REMOTE_WRITE_PASSWORD=${LAST9_REMOTE_WRITE_PASSWORD}
    ports:
    - '8125:8125/udp'
    restart: always

volumes:
  vmagentdata: {}
