# Java app and JVM config sourced from http://mintbeans.com/jvm-monitoring-docker/
version: '3.6'
services:
  jvmapp:
    build: jvmapp
    container_name: jvmapp
    ports:
      - "4000:4000"

  jmxtrans:
    image: jmxtrans/jmxtrans
    container_name: jmxtrans
    environment:
      CONTINUE_ON_ERROR: "false"
      SECONDS_BETWEEN_RUNS: 5
      GRAPHITE_HOST: vmagent_last9
      GRAPHITE_PORT: 2003
    volumes:
      - ./jmxtrans-config:/var/lib/jmxtrans
    depends_on:
      - jvmapp

  vmagent_last9:
    image: victoriametrics/vmagent:v1.85.3
    ports:
      - 8430:8429
      - 2003:2003/tcp
      - 2003:2003/udp
    volumes:
      - vmagentdata:/vmagentdata
      - ./relabel.yaml:/etc/relabel.yaml
      - ./vmagent.yaml:/etc/vmagent.yaml
    command:
      - "--graphiteListenAddr=:2003"
      - "--remoteWrite.url=${LAST9_REMOTE_WRITE_URL}"
      - "--remoteWrite.basicAuth.username=${LAST9_REMOTE_WRITE_USERNAME}"
      - "--remoteWrite.basicAuth.password=${LAST9_REMOTE_WRITE_PASSWORD}"
      - "--remoteWrite.relabelConfig=/etc/relabel.yaml"
      - "--promscrape.config=/etc/vmagent.yaml"
    restart: always

volumes:
  vmagentdata: {}
